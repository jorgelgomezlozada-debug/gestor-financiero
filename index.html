<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor Financiero COP</title>

  <!-- PWA Manifest dinámico mediante Data URI -->
  <link rel="manifest" href="data:application/manifest+json;utf8,%7B%22name%22%3A%22Gestor%20Financiero%20COP%22%2C%22short_name%22%3A%22Gestor%20COP%22%2C%22description%22%3A%22Control%20de%20ingresos%2C%20egresos%20y%20presupuestos%20en%20pesos%20colombianos%22%2C%22start_url%22%3A%22.%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f4f6f9%22%2C%22theme_color%22%3A%22%234f46e5%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22https%3A%2F%2Fcdn-icons-png.flaticon.com%2F512%2F2845%2F2845700.png%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fpng%22%2C%22purpose%22%3A%22any%20maskable%22%7D%5D%7D">
  <meta name="theme-color" content="#4f46e5">

  <style>
    :root {
      --primary: #4f46e5;
      --primary-dark: #4338ca;
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --text: #1f2937;
      --text-muted: #6b7280;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; }
    .app-container { width: 100%; max-width: 480px; background: var(--bg); min-height: 100vh; display: flex; flex-direction: column; position: relative; padding-bottom: 70px; }
    header { background: var(--primary); color: white; padding: 16px; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; box-shadow: 0 4px 12px rgba(79,70,229,0.2); }
    .header-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .month-selector { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.15); padding: 6px 12px; border-radius: 12px; margin-top: 8px; }
    .month-selector button { background: none; border: none; color: white; font-size: 18px; cursor: pointer; padding: 0 8px; }
    .month-selector input { background: transparent; border: none; color: white; font-size: 15px; font-weight: 600; text-align: center; color-scheme: dark; }
    .summary-card { background: var(--card-bg); margin: -20px 16px 16px; padding: 16px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: grid; grid-template-columns: 1fr 1fr; gap: 12px; position: relative; z-index: 5; }
    .balance-box { grid-column: span 2; text-align: center; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    .balance-title { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .balance-amount { font-size: 26px; font-weight: 700; color: var(--text); margin-top: 2px; }
    .stat-box { text-align: center; }
    .stat-title { font-size: 11px; color: var(--text-muted); }
    .stat-amount { font-size: 15px; font-weight: 600; margin-top: 2px; }
    .stat-amount.income { color: var(--success); }
    .stat-amount.expense { color: var(--danger); }
    .content { padding: 0 16px; flex: 1; }
    .section-header { display: flex; justify-content: space-between; align-items: center; margin: 16px 0 10px; }
    .section-title { font-size: 15px; font-weight: 700; }
    .btn-link { background: none; border: none; color: var(--primary); font-weight: 600; font-size: 13px; cursor: pointer; }
    .categories-grid { display: flex; flex-direction: column; gap: 10px; }
    .category-card { background: var(--card-bg); padding: 12px; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.03); cursor: pointer; border: 1px solid transparent; }
    .category-card:active { border-color: var(--primary); }
    .cat-info { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; font-weight: 600; }
    .progress-bar { height: 8px; background: #e5e7eb; border-radius: 4px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
    .tx-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .tx-item { background: var(--card-bg); padding: 12px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
    .tx-left { display: flex; gap: 10px; align-items: center; }
    .tx-icon { width: 36px; height: 36px; border-radius: 10px; background: #e0e7ff; color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .tx-title { font-size: 14px; font-weight: 600; }
    .tx-date { font-size: 11px; color: var(--text-muted); }
    .tx-amount { font-weight: 700; font-size: 14px; }
    .tx-amount.income { color: var(--success); }
    .tx-amount.expense { color: var(--danger); }
    .nav-bar { position: fixed; bottom: 0; width: 100%; max-width: 480px; background: var(--card-bg); display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid var(--border); }
    .nav-btn { background: none; border: none; display: flex; flex-direction: column; align-items: center; color: var(--text-muted); font-size: 11px; cursor: pointer; gap: 4px; }
    .nav-btn.active { color: var(--primary); font-weight: 600; }
    .fab { position: fixed; bottom: 75px; right: calc(50% - 220px); background: var(--primary); color: white; border: none; width: 50px; height: 50px; border-radius: 25px; font-size: 24px; box-shadow: 0 4px 10px rgba(79,70,229,0.4); cursor: pointer; display: flex; align-items: center; justify-content: center; }
    @media (max-width: 480px) { .fab { right: 20px; } }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; justify-content: center; align-items: flex-end; }
    .modal-content { background: var(--card-bg); width: 100%; max-width: 480px; border-top-left-radius: 20px; border-top-right-radius: 20px; padding: 20px; animation: slideUp 0.2s ease-out; max-height: 85vh; overflow-y: auto; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; font-weight: 600; }
    .form-control { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; }
    .btn { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px; }
    .btn-secondary { background: #e5e7eb; color: var(--text); margin-top: 8px; }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="header-title">
        <h2 style="font-size: 18px;">Gestor Financiero</h2>
        <button class="btn-link" style="color:white;" onclick="openBackupModal()">⚙️ Respaldo</button>
      </div>
      <div class="month-selector">
        <button onclick="changeMonth(-1)">❮</button>
        <input type="month" id="monthPicker" onchange="renderApp()">
        <button onclick="changeMonth(1)">❯</button>
      </div>
    </header>

    <div class="summary-card">
      <div class="balance-box">
        <div class="balance-title">Balance del Mes</div>
        <div class="balance-amount" id="totalBalance">$ 0</div>
      </div>
      <div class="stat-box">
        <div class="stat-title">Ingresos</div>
        <div class="stat-amount income" id="totalIncome">$ 0</div>
      </div>
      <div class="stat-box">
        <div class="stat-title">Egresos</div>
        <div class="stat-amount expense" id="totalExpense">$ 0</div>
      </div>
    </div>

    <div class="content">
      <div class="section-header">
        <span class="section-title">Topes por Categoría</span>
        <button class="btn-link" onclick="openCategoryModal()">+ Categoría</button>
      </div>
      <div class="categories-grid" id="categoriesGrid"></div>

      <div class="section-header" style="margin-top: 24px;">
        <span class="section-title">Movimientos</span>
      </div>
      <div class="tx-list" id="txList"></div>
    </div>

    <button class="fab" onclick="openTxModal()">+</button>
  </div>

  <!-- Modal Transacción -->
  <div class="modal" id="txModal">
    <div class="modal-content">
      <h3 style="margin-bottom: 12px;" id="txModalTitle">Nuevo Movimiento</h3>
      <div class="form-group">
        <label>Tipo</label>
        <select class="form-control" id="txType" onchange="updateCategorySelect()">
          <option value="expense">Egreso</option>
          <option value="income">Ingreso</option>
        </select>
      </div>
      <div class="form-group">
        <label>Monto (COP)</label>
        <input type="number" class="form-control" id="txAmount" placeholder="Ej: 50000">
      </div>
      <div class="form-group">
        <label>Categoría</label>
        <select class="form-control" id="txCategory"></select>
      </div>
      <div class="form-group">
        <label>Descripción</label>
        <input type="text" class="form-control" id="txDesc" placeholder="Ej: Mercado mensual">
      </div>
      <div class="form-group">
        <label>Fecha</label>
        <input type="date" class="form-control" id="txDate">
      </div>
      <button class="btn" onclick="saveTransaction()">Guardar</button>
      <button class="btn btn-secondary" onclick="closeModal('txModal')">Cancelar</button>
    </div>
  </div>

  <!-- Modal Crear Categoría -->
  <div class="modal" id="catModal">
    <div class="modal-content">
      <h3 style="margin-bottom: 12px;">Nueva Categoría</h3>
      <div class="form-group">
        <label>Tipo</label>
        <select class="form-control" id="catType">
          <option value="expense">Egreso</option>
          <option value="income">Ingreso</option>
        </select>
      </div>
      <div class="form-group">
        <label>Nombre</label>
        <input type="text" class="form-control" id="catName" placeholder="Ej: Mascotas">
      </div>
      <div class="form-group">
        <label>Icono (Emoji)</label>
        <input type="text" class="form-control" id="catIcon" value="🏷️">
      </div>
      <div class="form-group">
        <label>Tope Mensual (COP)</label>
        <input type="number" class="form-control" id="catLimit" placeholder="Ej: 200000">
      </div>
      <button class="btn" onclick="saveCategory()">Guardar Categoría</button>
      <button class="btn btn-secondary" onclick="closeModal('catModal')">Cancelar</button>
    </div>
  </div>

  <!-- Modal Respaldo -->
  <div class="modal" id="backupModal">
    <div class="modal-content">
      <h3 style="margin-bottom: 12px;">Copia de Seguridad</h3>
      <button class="btn" style="margin-bottom: 8px;" onclick="sendEmailReport()">✉️ Enviar Resumen al Correo</button>
      <button class="btn btn-secondary" style="margin-top:0;" onclick="exportJSON()">📥 Descargar Copia (JSON)</button>
      <button class="btn btn-secondary" onclick="closeModal('backupModal')">Cerrar</button>
    </div>
  </div>

  <script>
    const defaultCategories = [
      { id: '1', name: 'Alimentos', icon: '🛒', type: 'expense', limit: 800000 },
      { id: '2', name: 'Transporte', icon: '🚌', type: 'expense', limit: 300000 },
      { id: '3', name: 'Vivienda', icon: '🏠', type: 'expense', limit: 1200000 },
      { id: '4', name: 'Ocio', icon: '🎬', type: 'expense', limit: 250000 },
      { id: '5', name: 'Salario', icon: '💼', type: 'income', limit: 0 }
    ];

    let categories = JSON.parse(localStorage.getItem('app_categories')) || defaultCategories;
    let transactions = JSON.parse(localStorage.getItem('app_transactions')) || [];

    document.addEventListener('DOMContentLoaded', () => {
      const now = new Date();
      document.getElementById('monthPicker').value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
      document.getElementById('txDate').value = now.toISOString().split('T')[0];
      renderApp();
      registerSW();
    });

    function formatCOP(amount) {
      return '$ ' + new Intl.NumberFormat('de-DE').format(amount);
    }

    function changeMonth(delta) {
      const picker = document.getElementById('monthPicker');
      let [year, month] = picker.value.split('-').map(Number);
      month += delta;
      if (month > 12) { month = 1; year++; }
      if (month < 1) { month = 12; year--; }
      picker.value = `${year}-${String(month).padStart(2, '0')}`;
      renderApp();
    }

    function renderApp() {
      const selectedMonth = document.getElementById('monthPicker').value;
      const monthTxs = transactions.filter(t => t.date.startsWith(selectedMonth));

      let totalIncome = 0;
      let totalExpense = 0;

      monthTxs.forEach(t => {
        if (t.type === 'income') totalIncome += Number(t.amount);
        else totalExpense += Number(t.amount);
      });

      document.getElementById('totalBalance').textContent = formatCOP(totalIncome - totalExpense);
      document.getElementById('totalIncome').textContent = formatCOP(totalIncome);
      document.getElementById('totalExpense').textContent = formatCOP(totalExpense);

      // Render Categorías
      const catGrid = document.getElementById('categoriesGrid');
      catGrid.innerHTML = '';
      categories.filter(c => c.type === 'expense').forEach(c => {
        const spent = monthTxs.filter(t => t.categoryId === c.id).reduce((sum, t) => sum + Number(t.amount), 0);
        const percent = c.limit > 0 ? Math.min(Math.round((spent / c.limit) * 100), 100) : 0;
        let color = 'var(--success)';
        if (percent > 80) color = 'var(--warning)';
        if (spent > c.limit && c.limit > 0) color = 'var(--danger)';

        catGrid.innerHTML += `
          <div class="category-card">
            <div class="cat-info">
              <span>${c.icon} ${c.name}</span>
              <span>${formatCOP(spent)} / ${formatCOP(c.limit)}</span>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" style="width: ${percent}%; background: ${color};"></div>
            </div>
          </div>
        `;
      });

      // Render Movimientos
      const txList = document.getElementById('txList');
      txList.innerHTML = '';
      if (monthTxs.length === 0) {
        txList.innerHTML = '<div style="text-align:center; color: var(--text-muted); padding: 20px;">Sin movimientos este mes</div>';
      } else {
        monthTxs.sort((a,b) => new Date(b.date) - new Date(a.date)).forEach(t => {
          const cat = categories.find(c => c.id === t.categoryId) || { icon: '💰' };
          txList.innerHTML += `
            <div class="tx-item">
              <div class="tx-left">
                <div class="tx-icon">${cat.icon}</div>
                <div>
                  <div class="tx-title">${t.desc}</div>
                  <div class="tx-date">${t.date}</div>
                </div>
              </div>
              <div class="tx-amount ${t.type}">${t.type === 'income' ? '+' : '-'}${formatCOP(t.amount)}</div>
            </div>
          `;
        });
      }
    }

    function openTxModal() {
      updateCategorySelect();
      document.getElementById('txModal').style.display = 'flex';
    }

    function openCategoryModal() {
      document.getElementById('catModal').style.display = 'flex';
    }

    function openBackupModal() {
      document.getElementById('backupModal').style.display = 'flex';
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    function updateCategorySelect() {
      const type = document.getElementById('txType').value;
      const select = document.getElementById('txCategory');
      select.innerHTML = '';
      categories.filter(c => c.type === type).forEach(c => {
        select.innerHTML += `<option value="${c.id}">${c.icon} ${c.name}</option>`;
      });
    }

    function saveTransaction() {
      const amount = document.getElementById('txAmount').value;
      const desc = document.getElementById('txDesc').value;
      const date = document.getElementById('txDate').value;
      const type = document.getElementById('txType').value;
      const categoryId = document.getElementById('txCategory').value;

      if (!amount || !desc || !date) return alert('Completa todos los campos');

      transactions.push({ id: Date.now().toString(), amount: Number(amount), desc, date, type, categoryId });
      localStorage.setItem('app_transactions', JSON.stringify(transactions));
      closeModal('txModal');
      renderApp();
    }

    function saveCategory() {
      const name = document.getElementById('catName').value;
      const icon = document.getElementById('catIcon').value;
      const type = document.getElementById('catType').value;
      const limit = document.getElementById('catLimit').value || 0;

      if (!name) return alert('Ingresa un nombre');

      categories.push({ id: Date.now().toString(), name, icon, type, limit: Number(limit) });
      localStorage.setItem('app_categories', JSON.stringify(categories));
      closeModal('catModal');
      renderApp();
    }

    function exportJSON() {
      const data = JSON.stringify({ categories, transactions }, null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `backup_financiero_${new Date().toISOString().split('T')[0]}.json`;
      a.click();
    }

    function sendEmailReport() {
      const month = document.getElementById('monthPicker').value;
      const monthTxs = transactions.filter(t => t.date.startsWith(month));
      let body = `Resumen Financiero (${month}):\n\n`;
      monthTxs.forEach(t => {
        body += `${t.date} | ${t.desc} | ${t.type === 'income' ? '+' : '-'}${formatCOP(t.amount)}\n`;
      });
      window.location.href = `mailto:?subject=Resumen Financiero ${month}&body=${encodeURIComponent(body)}`;
    }

    function registerSW() {
      if ('serviceWorker' in navigator) {
        const swCode = `
          self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));
          self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
          self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
        `;
        const blob = new Blob([swCode], { type: 'text/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
      }
    }
  </script>
</body>
</html>
