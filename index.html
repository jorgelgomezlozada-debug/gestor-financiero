<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Control Financiero</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 h-full flex justify-center items-center">

    <div class="w-full h-full sm:max-w-md sm:h-[90vh] sm:rounded-3xl sm:shadow-2xl bg-white dark:bg-slate-900 flex flex-col overflow-hidden relative border border-slate-200 dark:border-slate-800">
        
        <header class="bg-indigo-600 text-white px-6 py-4 flex justify-between items-center shadow-md z-10">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center text-lg font-bold">
                    <i class="fa-solid fa-wallet"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold leading-tight">MiBolsillo</h1>
                    <p class="text-xs text-indigo-200">Control Financiero COP</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="openModal('backup-modal')" class="bg-white/10 hover:bg-white/20 p-2.5 rounded-full transition-all text-sm" title="Respaldo">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                </button>
                <button onclick="openModal('category-modal')" class="bg-white/10 hover:bg-white/20 p-2.5 rounded-full transition-all text-sm" title="Nueva Categoría">
                    <i class="fa-solid fa-folder-plus"></i>
                </button>
                <button onclick="openModal('budget-modal')" class="bg-white/10 hover:bg-white/20 p-2.5 rounded-full transition-all text-sm" title="Gestionar Topes">
                    <i class="fa-solid fa-sliders"></i>
                </button>
            </div>
        </header>

        <div class="bg-indigo-700 text-white px-4 py-2 flex justify-between items-center text-xs shadow-inner z-10">
            <button onclick="changeMonth(-1)" class="p-1.5 rounded-lg hover:bg-white/10">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-calendar-days text-indigo-300"></i>
                <input type="month" id="month-picker" onchange="onMonthPickerChange(this.value)" class="bg-transparent font-bold text-sm focus:outline-none cursor-pointer text-white text-center">
            </div>
            <button onclick="changeMonth(1)" class="p-1.5 rounded-lg hover:bg-white/10">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>

        <main class="flex-1 overflow-y-auto no-scrollbar pb-24 p-4 space-y-5">
            <section class="bg-gradient-to-br from-indigo-500 to-purple-600 text-white rounded-2xl p-5 shadow-lg relative overflow-hidden">
                <p class="text-xs uppercase tracking-wider text-indigo-200 font-medium">Balance Total (COP)</p>
                <h2 id="total-balance" class="text-3xl font-extrabold mt-1 tracking-tight">$ 0</h2>
                <div class="grid grid-cols-2 gap-4 mt-5 pt-4 border-t border-white/10">
                    <div class="flex items-center space-x-3">
                        <div class="w-8 h-8 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center">
                            <i class="fa-solid fa-arrow-down text-xs"></i>
                        </div>
                        <div>
                            <p class="text-[10px] uppercase text-indigo-200">Ingresos</p>
                            <p id="monthly-income" class="text-sm font-bold text-emerald-400">$ 0</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-3">
                        <div class="w-8 h-8 rounded-full bg-rose-500/20 text-rose-400 flex items-center justify-center">
                            <i class="fa-solid fa-arrow-up text-xs"></i>
                        </div>
                        <div>
                            <p class="text-[10px] uppercase text-indigo-200">Egresos</p>
                            <p id="monthly-expense" class="text-sm font-bold text-rose-400">$ 0</p>
                        </div>
                    </div>
                </div>
            </section>

            <section class="bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-sm border border-slate-100 dark:border-slate-700">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-sm font-bold text-slate-700 dark:text-slate-200 flex items-center gap-2">
                        <i class="fa-solid fa-chart-pie text-indigo-500"></i> Topes por Categoría
                    </h3>
                </div>
                <div id="budgets-container" class="space-y-3"></div>
            </section>

            <section class="space-y-3">
                <div class="flex justify-between items-center">
                    <h3 class="text-sm font-bold text-slate-700 dark:text-slate-200 flex items-center gap-2">
                        <i class="fa-solid fa-list-ul text-indigo-500"></i> Movimientos
                    </h3>
                    <div class="flex space-x-1 bg-slate-200 dark:bg-slate-700 p-1 rounded-lg text-xs">
                        <button onclick="setFilter('all')" id="filter-all" class="px-2.5 py-1 rounded-md font-medium bg-white dark:bg-slate-600 shadow-sm text-indigo-600 dark:text-indigo-400">Todos</button>
                        <button onclick="setFilter('income')" id="filter-income" class="px-2.5 py-1 rounded-md font-medium text-slate-600 dark:text-slate-300">Ingresos</button>
                        <button onclick="setFilter('expense')" id="filter-expense" class="px-2.5 py-1 rounded-md font-medium text-slate-600 dark:text-slate-300">Egresos</button>
                    </div>
                </div>
                <div id="transactions-list" class="space-y-2"></div>
            </section>
        </main>

        <div class="absolute bottom-6 right-6 z-20">
            <button onclick="openModal('transaction-modal')" class="w-14 h-14 bg-indigo-600 hover:bg-indigo-700 text-white rounded-full shadow-lg flex items-center justify-center text-xl transition-transform active:scale-95">
                <i class="fa-solid fa-plus"></i>
            </button>
        </div>

        <nav class="absolute bottom-0 left-0 right-0 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 px-6 py-2.5 flex justify-around items-center text-slate-500 dark:text-slate-400 z-10">
            <button onclick="openModal('transaction-modal')" class="flex flex-col items-center hover:text-indigo-600">
                <i class="fa-solid fa-circle-plus text-lg"></i>
                <span class="text-[10px] mt-0.5 font-medium">Añadir</span>
            </button>
            <button onclick="openModal('budget-modal')" class="flex flex-col items-center hover:text-indigo-600">
                <i class="fa-solid fa-chart-line text-lg"></i>
                <span class="text-[10px] mt-0.5 font-medium">Topes</span>
            </button>
            <button onclick="openModal('backup-modal')" class="flex flex-col items-center hover:text-indigo-600">
                <i class="fa-solid fa-shield-halved text-lg"></i>
                <span class="text-[10px] mt-0.5 font-medium">Respaldo</span>
            </button>
        </nav>
    </div>

    <!-- MODAL TRANSACCIÓN -->
    <div id="transaction-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white dark:bg-slate-900 w-full sm:max-w-md rounded-t-3xl sm:rounded-2xl p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-100 dark:border-slate-800">
                <h3 class="text-base font-bold text-slate-800 dark:text-white">Nueva Transacción</h3>
                <button onclick="closeModal('transaction-modal')" class="text-slate-400"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="transaction-form" onsubmit="handleTransactionSubmit(event)" class="space-y-4">
                <div class="grid grid-cols-2 gap-2 p-1 bg-slate-100 dark:bg-slate-800 rounded-xl">
                    <button type="button" id="type-expense" onclick="setTransactionType('expense')" class="py-2 text-xs font-semibold rounded-lg bg-white dark:bg-slate-700 text-rose-500 shadow-sm">Egreso</button>
                    <button type="button" id="type-income" onclick="setTransactionType('income')" class="py-2 text-xs font-semibold rounded-lg text-slate-500">Ingreso</button>
                </div>
                <div>
                    <label class="block text-xs font-medium mb-1">Monto ($ COP)</label>
                    <input type="number" step="1" id="tx-amount" required placeholder="0" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border rounded-xl text-slate-800 dark:text-white font-semibold">
                </div>
                <div>
                    <label class="block text-xs font-medium mb-1">Categoría</label>
                    <select id="tx-category" required class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border rounded-xl text-slate-800 dark:text-white"></select>
                </div>
                <div>
                    <label class="block text-xs font-medium mb-1">Fecha</label>
                    <input type="date" id="tx-date" required class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border rounded-xl text-slate-800 dark:text-white">
                </div>
                <div>
                    <label class="block text-xs font-medium mb-1">Descripción</label>
                    <input type="text" id="tx-desc" placeholder="Detalle..." class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border rounded-xl text-slate-800 dark:text-white">
                </div>
                <button type="submit" class="w-full py-3 bg-indigo-600 text-white font-medium rounded-xl shadow-md">Guardar</button>
            </form>
        </div>
    </div>

    <!-- MODAL GESTIÓN DE TOPES -->
    <div id="budget-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white dark:bg-slate-900 w-full sm:max-w-md rounded-t-3xl sm:rounded-2xl p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-100 dark:border-slate-800">
                <h3 class="text-base font-bold text-slate-800 dark:text-white">Gestionar Topes Mensuales</h3>
                <button onclick="closeModal('budget-modal')" class="text-slate-400"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form onsubmit="handleBudgetSubmit(event)" class="space-y-4">
                <div id="budget-inputs-list" class="space-y-3"></div>
                <button type="submit" class="w-full py-3 bg-indigo-600 text-white font-medium rounded-xl shadow-md">Actualizar Topes</button>
            </form>
        </div>
    </div>

    <!-- MODAL NUEVA CATEGORÍA -->
    <div id="category-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white dark:bg-slate-900 w-full sm:max-w-md rounded-t-3xl sm:rounded-2xl p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-100 dark:border-slate-800">
                <h3 class="text-base font-bold text-slate-800 dark:text-white">Nueva Categoría</h3>
                <button onclick="closeModal('category-modal')" class="text-slate-400"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form onsubmit="handleCategorySubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium mb-1">Nombre</label>
                    <input type="text" id="cat-name" required placeholder="Ej. Mascotas" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border rounded-xl text-slate-800 dark:text-white">
                </div>
                <div>
                    <label class="block text-xs font-medium mb-1">Tope Mensual ($ COP)</label>
                    <input type="number" step="1" id="cat-budget" placeholder="200000" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border rounded-xl text-slate-800 dark:text-white">
                </div>
                <button type="submit" class="w-full py-3 bg-indigo-600 text-white font-medium rounded-xl shadow-md">Crear Categoría</button>
            </form>
        </div>
    </div>

    <!-- MODAL DETALLE DE CATEGORÍA -->
    <div id="category-detail-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white dark:bg-slate-900 w-full sm:max-w-md rounded-t-3xl sm:rounded-2xl p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-100 dark:border-slate-800">
                <h3 id="cat-detail-title" class="text-base font-bold text-slate-800 dark:text-white">Detalle</h3>
                <button onclick="closeModal('category-detail-modal')" class="text-slate-400"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div id="cat-detail-summary" class="bg-slate-50 dark:bg-slate-800 p-4 rounded-xl border mb-4 space-y-2 text-xs"></div>
            <div class="space-y-3">
                <h4 class="text-xs font-bold uppercase text-slate-400">Movimientos</h4>
                <div id="cat-detail-tx-list" class="space-y-2"></div>
            </div>
        </div>
    </div>

    <!-- MODAL RESPALDO -->
    <div id="backup-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white dark:bg-slate-900 w-full sm:max-w-md rounded-t-3xl sm:rounded-2xl p-6 shadow-2xl space-y-3">
            <div class="flex justify-between items-center pb-2 border-b border-slate-100 dark:border-slate-800">
                <h3 class="text-base font-bold text-slate-800 dark:text-white">Respaldo de Datos</h3>
                <button onclick="closeModal('backup-modal')" class="text-slate-400"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <button onclick="exportJSONBackup()" class="w-full py-3 px-4 bg-emerald-600 text-white rounded-xl text-xs font-bold">📥 Descargar Respaldo JSON</button>
            <label class="w-full py-3 px-4 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 rounded-xl text-xs font-bold cursor-pointer block text-center">
                📤 Restaurar Respaldo JSON
                <input type="file" accept=".json" onchange="importJSONBackup(event)" class="hidden">
            </label>
        </div>
    </div>

    <script>
        const INITIAL_CATEGORIES = {
            expense: [
                { name: 'Comida', icon: 'fa-utensils' },
                { name: 'Transporte', icon: 'fa-car' },
                { name: 'Ocio', icon: 'fa-gamepad' },
                { name: 'Servicios', icon: 'fa-bolt' },
                { name: 'Salud', icon: 'fa-kit-medical' },
                { name: 'Otros', icon: 'fa-tag' }
            ],
            income: [
                { name: 'Salario', icon: 'fa-briefcase' },
                { name: 'Freelance', icon: 'fa-laptop-code' },
                { name: 'Otros', icon: 'fa-circle-plus' }
            ]
        };

        const today = new Date();
        const initialMonth = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`;

        let state = {
            categories: JSON.parse(localStorage.getItem('mibolsillo_categories')) || INITIAL_CATEGORIES,
            transactions: JSON.parse(localStorage.getItem('mibolsillo_transactions')) || [],
            budgets: JSON.parse(localStorage.getItem('mibolsillo_budgets')) || { 'Comida': 800000, 'Transporte': 300000, 'Ocio': 400000, 'Servicios': 350000, 'Salud': 200000, 'Otros': 150000 },
            selectedMonth: initialMonth,
            currentType: 'expense',
            filter: 'all'
        };

        function formatCOP(amount) {
            return '$ ' + Math.round(amount).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        }

        function saveState() {
            localStorage.setItem('mibolsillo_categories', JSON.stringify(state.categories));
            localStorage.setItem('mibolsillo_transactions', JSON.stringify(state.transactions));
            localStorage.setItem('mibolsillo_budgets', JSON.stringify(state.budgets));
        }

        function changeMonth(offset) {
            const [year, month] = state.selectedMonth.split('-').map(Number);
            const date = new Date(year, month - 1 + offset, 1);
            state.selectedMonth = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
            renderApp();
        }

        function onMonthPickerChange(val) { if(val) { state.selectedMonth = val; renderApp(); } }

        function setTransactionType(type) {
            state.currentType = type;
            document.getElementById('type-expense').className = type === 'expense' ? "py-2 text-xs font-semibold rounded-lg bg-white dark:bg-slate-700 text-rose-500 shadow-sm" : "py-2 text-xs font-semibold rounded-lg text-slate-500";
            document.getElementById('type-income').className = type === 'income' ? "py-2 text-xs font-semibold rounded-lg bg-white dark:bg-slate-700 text-emerald-500 shadow-sm" : "py-2 text-xs font-semibold rounded-lg text-slate-500";
            updateCategorySelect();
        }

        function updateCategorySelect() {
            const select = document.getElementById('tx-category');
            select.innerHTML = '';
            state.categories[state.currentType].forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.name; opt.textContent = c.name;
                select.appendChild(opt);
            });
        }

        function openModal(id) {
            document.getElementById(id).classList.remove('hidden');
            if(id === 'transaction-modal') { document.getElementById('tx-date').value = `${state.selectedMonth}-01`; updateCategorySelect(); }
            if(id === 'budget-modal') renderBudgetInputs();
        }

        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        function renderApp() {
            document.getElementById('month-picker').value = state.selectedMonth;
            const monthTx = state.transactions.filter(t => t.date.startsWith(state.selectedMonth));
            let inc = 0, exp = 0;
            monthTx.forEach(t => { if(t.type === 'income') inc += Number(t.amount); else exp += Number(t.amount); });

            document.getElementById('total-balance').textContent = formatCOP(inc - exp);
            document.getElementById('monthly-income').textContent = formatCOP(inc);
            document.getElementById('monthly-expense').textContent = formatCOP(exp);

            renderBudgetsProgress(monthTx);
            renderTransactions(monthTx);
        }

        function renderBudgetsProgress(monthTx) {
            const container = document.getElementById('budgets-container');
            container.innerHTML = '';
            const expenseTotals = {};
            monthTx.filter(t => t.type === 'expense').forEach(t => { expenseTotals[t.category] = (expenseTotals[t.category] || 0) + Number(t.amount); });

            state.categories.expense.forEach(cat => {
                const limit = state.budgets[cat.name] || 0;
                const spent = expenseTotals[cat.name] || 0;
                const percentage = limit > 0 ? Math.min(Math.round((spent / limit) * 100), 100) : 0;

                const item = document.createElement('div');
                item.className = "space-y-1 cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800 p-2 rounded-lg transition-colors";
                item.onclick = () => openCategoryDetail(cat.name);
                item.innerHTML = `
                    <div class="flex justify-between text-xs font-medium">
                        <span class="flex items-center gap-1.5"><i class="fa-solid ${cat.icon} text-indigo-500"></i> ${cat.name}</span>
                        <span>${formatCOP(spent)} / ${formatCOP(limit)}</span>
                    </div>
                    <div class="w-full bg-slate-100 dark:bg-slate-700 h-2 rounded-full overflow-hidden">
                        <div class="bg-indigo-500 h-full rounded-full" style="width: ${percentage}%"></div>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function openCategoryDetail(catName) {
            document.getElementById('cat-detail-title').innerHTML = `<i class="fa-solid text-indigo-500"></i> ${catName}`;
            const monthTx = state.transactions.filter(t => t.category === catName && t.date.startsWith(state.selectedMonth));
            const spent = monthTx.reduce((acc, curr) => acc + Number(curr.amount), 0);
            const limit = state.budgets[catName] || 0;

            document.getElementById('cat-detail-summary').innerHTML = `
                <div class="flex justify-between"><span>Gastado:</span><span class="font-bold">${formatCOP(spent)}</span></div>
                <div class="flex justify-between"><span>Tope:</span><span class="font-bold">${formatCOP(limit)}</span></div>
            `;

            const listEl = document.getElementById('cat-detail-tx-list');
            listEl.innerHTML = monthTx.length === 0 ? '<p class="text-xs text-slate-400 text-center py-2">Sin movimientos</p>' : '';
            monthTx.forEach(tx => {
                listEl.innerHTML += `<div class="flex justify-between items-center text-xs bg-slate-50 dark:bg-slate-800 p-2 rounded"><span>${tx.desc || catName}</span><span class="font-bold text-rose-500">-${formatCOP(tx.amount)}</span></div>`;
            });
            document.getElementById('category-detail-modal').classList.remove('hidden');
        }

        function renderBudgetInputs() {
            const container = document.getElementById('budget-inputs-list');
            container.innerHTML = '';
            state.categories.expense.forEach(cat => {
                const val = state.budgets[cat.name] || 0;
                container.innerHTML += `
                    <div class="flex items-center justify-between space-x-3">
                        <label class="text-xs font-medium w-1/3">${cat.name}</label>
                        <input type="number" data-category="${cat.name}" value="${val}" class="budget-input w-2/3 px-3 py-2 bg-slate-50 dark:bg-slate-800 border rounded-lg text-xs">
                    </div>
                `;
            });
        }

        function handleBudgetSubmit(e) {
            e.preventDefault();
            document.querySelectorAll('.budget-input').forEach(input => {
                state.budgets[input.getAttribute('data-category')] = parseFloat(input.value) || 0;
            });
            saveState(); renderApp(); closeModal('budget-modal');
        }

        function handleCategorySubmit(e) {
            e.preventDefault();
            const name = document.getElementById('cat-name').value.trim();
            const budget = parseFloat(document.getElementById('cat-budget').value) || 0;
            if(!name) return;
            state.categories.expense.push({ name, icon: 'fa-tag' });
            state.budgets[name] = budget;
            saveState(); renderApp(); closeModal('category-modal');
        }

        function handleTransactionSubmit(e) {
            e.preventDefault();
            state.transactions.push({
                id: Date.now(),
                type: state.currentType,
                amount: parseFloat(document.getElementById('tx-amount').value),
                category: document.getElementById('tx-category').value,
                date: document.getElementById('tx-date').value,
                desc: document.getElementById('tx-desc').value
            });
            saveState(); renderApp(); closeModal('transaction-modal');
        }

        function deleteTransaction(id) {
            state.transactions = state.transactions.filter(t => t.id !== id);
            saveState();
            renderApp();
        }

        function setFilter(type) {
            state.filter = type;
            renderApp();
        }

        function renderTransactions(monthTx) {
            const container = document.getElementById('transactions-list');
            container.innerHTML = '';
            let filtered = state.filter === 'all' ? monthTx : monthTx.filter(t => t.type === state.filter);
            filtered.forEach(tx => {
                container.innerHTML += `
                    <div class="bg-slate-50 dark:bg-slate-800 p-3 rounded-xl flex justify-between items-center text-xs">
                        <div><p class="font-bold">${tx.category}</p><p class="text-[10px] text-slate-400">${tx.date} - ${tx.desc || ''}</p></div>
                        <div class="flex items-center space-x-3">
                            <span class="font-bold ${tx.type === 'income' ? 'text-emerald-500' : 'text-rose-500'}">${tx.type === 'income' ? '+' : '-'}${formatCOP(tx.amount)}</span>
                            <button onclick="deleteTransaction(${tx.id})" class="text-slate-400 hover:text-rose-500 p-1" title="Eliminar">
                                <i class="fa-solid fa-trash-can text-xs"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function exportJSONBackup() {
            const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
            a.download = `respaldo_${state.selectedMonth}.json`; a.click();
        }

        function importJSONBackup(event) {
            const reader = new FileReader();
            reader.onload = e => {
                try {
                    const imp = JSON.parse(e.target.result);
                    if(imp.categories && imp.transactions) { state = imp; saveState(); renderApp(); closeModal('backup-modal'); alert('Restaurado con éxito'); }
                } catch(err) { alert('Archivo inválido'); }
            };
            if(event.target.files[0]) reader.readAsText(event.target.files[0]);
        }

        window.onload = renderApp;
    </script>
</body>
</html>
